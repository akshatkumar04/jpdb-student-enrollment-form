<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Enrollment Form</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="container" style="max-width:640px">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white"><h4 class="mb-0">Student Enrollment Form</h4></div>
    <div class="card-body">
      <div id="alertBox"></div>
      <form id="studentForm" onsubmit="return false;">
        <div class="mb-3"><label class="form-label" for="rollNo">Roll No</label>
          <input type="text" class="form-control" id="rollNo"></div>
        <div class="mb-3"><label class="form-label" for="fullName">Full Name</label>
          <input type="text" class="form-control" id="fullName"></div>
        <div class="mb-3"><label class="form-label" for="stdClass">Class</label>
          <input type="text" class="form-control" id="stdClass"></div>
        <div class="mb-3"><label class="form-label" for="birthDate">Birth Date</label>
          <input type="date" class="form-control" id="birthDate"></div>
        <div class="mb-3"><label class="form-label" for="address">Address</label>
          <input type="text" class="form-control" id="address"></div>
        <div class="mb-3"><label class="form-label" for="enrollmentDate">Enrollment Date</label>
          <input type="date" class="form-control" id="enrollmentDate"></div>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-success" id="saveBtn">Save</button>
          <button type="button" class="btn btn-warning" id="updateBtn">Update</button>
          <button type="button" class="btn btn-secondary" id="resetBtn">Reset</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="http://login2explore.com/jpdb/resources/js/0.0.3/jpdb-commons.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
